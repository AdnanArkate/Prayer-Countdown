<!DOCTYPE html>
<html>
<head>
  <title>Prayer Countdown</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f6f8;
    }
    #box {
      padding: 20px 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      font-size: 20px;
    }
  </style>
</head>
<body>

<div id="box">Loading...</div>

<script>
const prayers = [
  { name: "Fajr", time: "05:30" },
  { name: "Dhuhr", time: "13:15" },
  { name: "Asr", time: "16:30" },
  { name: "Maghrib", time: "18:30" },
  { name: "Isha", time: "20:30" }
];

function getUSTime() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
}

function getNextPrayer(now) {
  let today = now.toISOString().split("T")[0];

  for (let p of prayers) {
    let time = new Date(`${today}T${p.time}:00`);
    if (now < time) return { ...p, date: time };
    if (now.getTime() === time.getTime()) return "NOW";
  }

  // next day Fajr
  let tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  let nextDate = tomorrow.toISOString().split("T")[0];

  return {
    name: prayers[0].name,
    date: new Date(`${nextDate}T${prayers[0].time}:00`)
  };
}

function format(diff, name) {
  let h = Math.floor(diff / 3600000);
  let m = Math.floor((diff % 3600000) / 60000);
  let s = Math.floor((diff % 60000) / 1000);

  let txt = "";
  if (h > 0) txt += h + " hr ";
  if (m > 0) txt += m + " min ";
  txt += s + " sec";

  return txt + " for " + name;
}

function update() {
  let now = getUSTime();
  let next = getNextPrayer(now);

  if (next === "NOW") {
    document.getElementById("box").innerText = "Time for prayer";
    return;
  }

  let diff = next.date - now;
  document.getElementById("box").innerText = format(diff, next.name);
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
